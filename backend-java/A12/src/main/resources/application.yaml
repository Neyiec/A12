server:
  port: 8088

spring:
  servlet:
    multipart:
      # 导出成果回传允许 100MB 文件；请求额外留出 multipart 头部空间。
      max-file-size: 100MB
      max-request-size: 105MB
  datasource:
    url: jdbc:mysql://localhost:3306/a12?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: whn20050907
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  mail:
    host: smtp.qq.com
    port: 465
    username: 3276142066@qq.com
    password: lpaizjmdsjebciii
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: smtp.qq.com
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: your_access_key_id
    access-key-secret: your_access_key_secret
    bucket-name: a12-teaching

mybatis:
  mapper-locations: classpath:edu/zstu/mapper/*.xml
  type-aliases-package: edu.zstu.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

a12:
  storage:
    provider: ${A12_STORAGE_PROVIDER:oss}
    local:
      directory: ${A12_STORAGE_LOCAL_DIR:./data/uploads}
      base-url: ${A12_STORAGE_LOCAL_BASE_URL:http://localhost:8088}
      max-bytes: 104857600
  python:
    base-url: http://127.0.0.1:8001
    internal-key: ${A12_PYTHON_INTERNAL_KEY:}
    connect-timeout-seconds: 5
    request-timeout-seconds: 180
  export:
    local-dir: data/exports
    public-prefix: /exports
