server:
  port: 8088

spring:
  task:
    scheduling:
      # 导出 Worker 会等待 Python 生成，保留独立调度线程避免阻塞社区定时任务。
      pool:
        size: 2

  datasource:
    url: jdbc:mysql://localhost:3306/a12?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: whn20050907
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

  mail:
    host: smtp.qq.com
    port: 465
    username: 3276142066@qq.com
    password: lpaizjmdsjebciii
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: smtp.qq.com
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: your_access_key_id
    access-key-secret: your_access_key_secret
    bucket-name: a12-teaching

mybatis:
  mapper-locations: classpath:edu/zstu/mapper/*.xml
  type-aliases-package: edu.zstu.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

a12:
  python:
    base-url: http://127.0.0.1:8001
    connect-timeout-seconds: 5
    request-timeout-seconds: 180
  export:
    local-dir: data/exports
    public-prefix: /exports
    queue-poll-ms: 500
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    publish-timeout-seconds: 3
    topics:
      resource-index-request: a12.resource.index.requested
      resource-index-result: a12.resource.index.result
      classroom-event: a12.classroom.events
      teacher-feedback: a12.teacher.feedback
      dead-letter: a12.dead-letter
